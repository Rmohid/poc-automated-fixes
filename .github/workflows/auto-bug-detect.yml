name: Auto Bug Detection

on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
    branches-ignore:
      - main
      - master

permissions:
  issues: write
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
        continue-on-error: true

      - name: Run linter
        id: lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-output.txt
        continue-on-error: true

      - name: Check for duplicate issues
        id: check-duplicate
        if: steps.tests.outcome == 'failure' || steps.lint.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'auto-fix',
              per_page: 100,
            });

            const branchRef = context.ref || '';
            const duplicate = issues.find(issue =>
              issue.body && issue.body.includes(branchRef)
            );

            if (duplicate) {
              console.log(`Duplicate found: issue #${duplicate.number} already tracks failures on ${branchRef}`);
              core.setOutput('duplicate_found', 'true');
            } else {
              console.log(`No duplicate found for branch ${branchRef}`);
              core.setOutput('duplicate_found', 'false');
            }

      - name: Create issue on failure
        id: create-issue
        if: (steps.tests.outcome == 'failure' || steps.lint.outcome == 'failure') && steps.check-duplicate.outputs.duplicate_found != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const testOutput = fs.existsSync('test-output.txt')
              ? fs.readFileSync('test-output.txt', 'utf8')
              : '(no output captured)';
            const lintOutput = fs.existsSync('lint-output.txt')
              ? fs.readFileSync('lint-output.txt', 'utf8')
              : '(no output captured)';

            const truncate = (str, max) => str.length > max ? str.substring(0, max) + '\n... (truncated)' : str;

            const body = [
              '## Automated Bug Report',
              '',
              `**Commit:** ${context.sha}`,
              `**Branch:** ${context.ref}`,
              '',
              '### Test Output',
              '```',
              truncate(testOutput, 3000),
              '```',
              '',
              '### Lint Output',
              '```',
              truncate(lintOutput, 3000),
              '```',
              '',
              '---',
              '*This issue was auto-generated by the CI pipeline. To propose a fix, open this issue in [Copilot Workspace](https://copilot-workspace.githubnext.com).*',
            ].join('\n');

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Auto] Build failure: ${context.sha.substring(0, 7)}`,
              labels: ['auto-fix', 'bug'],
              body: body,
            });

            console.log(`Created issue #${issue.number}`);
            core.setOutput('issue_number', issue.number);

      - name: Sync to Jira (optional)
        if: steps.create-issue.outputs.issue_number && env.JIRA_BASE_URL != ''
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: |
          curl -s -X POST "${JIRA_BASE_URL}/rest/api/3/issue" \
            -H "Authorization: Basic ${JIRA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"fields\": {
                \"project\": {\"key\": \"${JIRA_PROJECT_KEY}\"},
                \"summary\": \"[Auto-Fix] Build failure ${GITHUB_SHA}\",
                \"issuetype\": {\"name\": \"Bug\"},
                \"labels\": [\"auto-detected\", \"github-managed\"]
              }
            }"
